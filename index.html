<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGBTfy</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="src/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="src/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="src/img/favicon-16x16.png">
    <link rel="manifest" href="src/site.webmanifest">
</head>

<body>

    <header><!--    HEADER          HEADER          HEADER          HEADER  -->
        <div class="logo">
            <img id="logoImg" src="./src/svg/logo.svg" alt="">
            <h1> <span class="red">L</span><span class="orange">G</span><span class="yellow">B</span><span
                    class="green">T</span><span class="blue">f</span><span class="violet">y</span> pfp</h1>
        </div>
        <div class="credits">
            <p>By <a href="https://spart.ovh/">Raven Spart<span class="wideOnly"> (Robin888b)</span></a></p>
        </div>
    </header>


    <section>

        <div id="square"><!--   IMG/INPUT           IMG/INPUT           IMG/INPUT   -->
            <canvas id="canvas" class="dpNone" height="1000" width="1000">votre navigateur ne supporte pas canvas</canvas>
            <div id="inputDiv">
                <h2>Upload a picture<br><span>Drag & Drop or Click here</span></h2>
                <input type="file" name="fileInput" id="fileInput" accept="image/*">
            </div>
        </div>




        <div id="controls" class="dpNone"><!-- CONTROLS        CONTROLS        CONTROLS    -->
            <div>

                <p>
                    Flag :
                    <select name="" id="flagSelect">
                        <option value="0" selected>Raimbow</option>
                        <option value="1">Agender</option>
                        <option value="2">Aromantic</option>
                        <option value="3">Asexual</option>
                        <option value="4">Bear</option>
                        <option value="5">Bisexual</option>
                        <option value="6">DemiBoy</option>
                        <option value="7">DemiGirl</option>
                        <option value="8">Gay Men</option>
                        <option value="9">GenderFluid</option>
                        <option value="10">GenderQueer</option>
                        <option value="11">Lesbian</option>
                        <option value="12">NonBinary</option>
                        <option value="13">Omnisexual</option>
                        <option value="14">Pansexual</option>
                        <option value="15">Transgender</option>
                    </select>

                    <!--
                    [
                        "../src/flag/normal/flagClassic.svg",
                        "../src/flag/normal/flagAgender.svg",
                        "../src/flag/normal/flagAromantic.svg",
                        "../src/flag/normal/flagAsexual.svg",
                        "../src/flag/normal/flagBear.svg",
                        "../src/flag/normal/flagBi.svg",
                        "../src/flag/normal/flagDemiBoy.svg",
                        "../src/flag/normal/flagDemiGirl.svg",
                        "../src/flag/normal/flagGayMen.svg",
                        "../src/flag/normal/flagGenderFluid.svg",
                        "../src/flag/normal/flagGenderQueer.svg",
                        "../src/flag/normal/flagLesbian.svg",
                        "../src/flag/normal/flagNonBinary.svg",
                        "../src/flag/normal/flagOmnisexual.svg",
                        "../src/flag/normal/flagPan.svg",
                        "../src/flag/normal/flagTrans.svg"
                    ]
                    -->

                    <select name="" id="flagModaSelect">
                        <option value="0">normal</option>
                        <option value="2" selected>gradient</option>
                        <option value="3">Dash</option>
                    </select><br><br>

                    Output : 
                    <label for="togglSquare" id="TogglSquareLabel" class="toggle">
                        <input type="checkbox" name="togglSquare" id="togglSquare">
                        <span id="dspToglCircle" class="selectedToggl">Circle</span><span id="dspTogglSquare" class="">Square</span>
                    </label>
                    <br><br>

                    Rotation :
                    <input type="range" min="-45" step="15" value="-45" max="45" id="rotationRange">
                    <input type="number" min="-45" value="-45" max="45" id="rotationInput">
                    <br><br>

                    Image size (px) :
                    <input type="range" min="100" step="50" value="1000" max="2500" id="sizeRange">
                    <input type="number" min="100" value="1000" max="2500" id="sizeInput">
                    <br><br>

                    Clip mode :
                    <select id="clipModeSelect">
                        <option value="0">Transparency</option>
                        <option value="1" selected>Circle</option>
                        <option value="2">Blured Circle</option>
                        <option value="3" id="clipOptionSquare" class="dpNone">square</option>
                        <option value="4">heart</option>
                    </select>

                    <p id="brderRadiusControl">
                        <br>
                        Border Radius (%)
                        <input type="range" min="0" value="5" step="1" max="50"  id="borderRadiusRange">
                        <input type="number" min="0"  value="5" max="50" id="borderRadiusInput">
                    </p>

                    <p id="borderControl" class="dpNone">
                    <br>
                        Border size (%) :
                        <input type="range" min="0" value="10" max="25"  id="borderSizeRange">
                        <input type="number" min="0"  value="10" max="25" id="borderSizeInput">
                    </p>
                    
                </p>
            </div>
        </div>
    </section>


    <section id="cropSection" class="dpNone">

        <div id="cropWindows">
            <div id="cropCanvasDiv">
                <canvas id="cropCanvas"></canvas>
            </div>
            <div>
                <span>
                    Zoom
                </span>
                <input type="range" name="cropZoomRange" id="cropZoomRange" min="1" max="100" value="0">
                <input type="number" name="cropZoomInput" id="cropZoomInput" min="1" max="100" value="0">
            </div>
            <div id="cropValidateDiv">
                <button id="cropValidate">Validate</button>
            </div>
        </div>

    </section>

    <section id="previewSection" class="dpNone">
        <button id="closePreview"></button>
        <div id="previewDiv">
            <img src="" alt="your picture" id="previewPicture">
            <div>
                <a id="previewDownload" download>Download</a>
                <button id="previewCopy" >Copy to Clipboard</button>
                <label for="previewUploadNew">
                    Upload new Image
                    <input type="file" name="previewUploadNew" id="previewUploadNew" accept="image/*">
                </label>
            </div>
        </div>
    </section>
</body>
<script src="./src/app.js"></script>
<script src="./src/crop.js"></script>
<script src="https://keepandroidopen.org/banner.js?size=mini"></script>
</html>
